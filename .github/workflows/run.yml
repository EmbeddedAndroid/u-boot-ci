# One run (docs/architecture.md): a nightly of main or master, or an
# ad-hoc run of series stacked onto one of them (docs/adhoc-runs.md).
# Called by nightly.yml, adhoc.yml and adhoc-issue.yml.
#
# Three jobs, one after the other (a fourth when the run ends early),
# each on its own CIL lease: one xeon lease for the heavy work, small
# arm64 leases for the rest (the xeon pool's load and power draw are the
# scarce ones).
#   prepare  arm64: resolves the refs, fetches and applies the series
#            (git am, nothing from them runs), creates the run document
#            and publishes it (writes gh-pages).
#   ci       xeon: everything that builds or runs U-Boot or patch code
#            (Linux payload, the 8 host checks, every board and stack,
#            scripts/run-all.sh). No environment, no secret, a read-only
#            token that is not left in the checkout.
#   submit   arm64, in the lava-hw environment (deployments from main
#            only): holds LAVA_TOKEN and the BL2 pins;
#            runs no U-Boot code: adds the BL2 to the packages, uploads
#            them, submits, reads results back and publishes.
#   finalize arm64, only when the run ended before submit did (a cancel
#            or a failure): closes the published run document.
# prepare, submit and finalize run their commands in the control image.
name: run

on:
  workflow_call:
    inputs:
      kind:
        description: nightly or adhoc
        type: string
        required: true
      base:
        description: main or master
        type: string
        required: true
      series:
        description: Message-IDs, space separated, in order (ad-hoc runs)
        type: string
        default: ""
      targets:
        description: board:stack,... (empty for every board and stack)
        type: string
        default: ""
      title:
        type: string
        default: ""

permissions:
  contents: read

env:
  CI_RUN: scripts/in-container.sh
  UBOOT_REPO: https://git.u-boot-project.org/u-boot/u-boot.git
  LINUX_NEXT: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
  FINGERPRINT: ubci-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.base }}
  UBCI_WORK: ${{ github.workspace }}/work

jobs:
  prepare:
    # No U-Boot code runs here, so it may write gh-pages.
    runs-on: [self-hosted, cil, arm64, 2c-4g-20g]
    permissions:
      contents: write
    env:
      UBCI_IMAGE: u-boot-ci-control:1
    outputs:
      commit: ${{ steps.refs.outputs.commit }}
      linux_tag: ${{ steps.refs.outputs.linux_tag }}
      baseline: ${{ steps.refs.outputs.baseline }}
      base_commit: ${{ steps.refs.outputs.base_commit }}
    steps:
      - uses: actions/checkout@v4
      - id: refs
        name: Resolve the base commit, the linux-next tag and the baseline
        env:
          BASE: ${{ inputs.base }}
        run: |
          case $BASE in main|master) ;; *) echo "bad base '$BASE'" >&2; exit 1 ;; esac
          commit=$(git ls-remote "$UBOOT_REPO" "refs/heads/$BASE" | cut -f1)
          [ -n "$commit" ] || { echo "no $BASE branch" >&2; exit 1; }
          tag=$(git ls-remote --tags "$LINUX_NEXT" 'refs/tags/next-*' | sed -n 's|.*refs/tags/\(next-[0-9]\{8\}\)$|\1|p' | sort | tail -1)
          # The latest nightly of the same branch: the baseline of this run,
          # and for a nightly the start of "the day's new commits".
          git fetch -q origin gh-pages 2>/dev/null && git show origin/gh-pages:index.json > previous.json 2>/dev/null || echo '{}' > previous.json
          read -r baseline base_commit < <(python3 - "$BASE" <<'PY'
          import json, sys
          d = json.load(open("previous.json"))
          rid = d.get("branches", {}).get(sys.argv[1], {}).get("latest_nightly")
          r = [x for x in d.get("runs", []) if x["id"] == rid]
          print(r[0]["id"], r[0]["base"]["commit"]) if r else print("- -")
          PY
          )
          { echo "commit=$commit"; echo "linux_tag=$tag"; echo "baseline=${baseline#-}"; echo "base_commit=${base_commit#-}"; } >> "$GITHUB_OUTPUT"
      - name: Build the control container
        run: docker build --network host -q --target control -t "$UBCI_IMAGE" docker
      - name: Fetch and apply the series (ad-hoc runs)
        if: inputs.series != ''
        env:
          SERIES: ${{ inputs.series }}
        run: |
          # Validated again here: workflow_dispatch inputs are free text.
          ids=$(python3 -m ubci.request inputs "$SERIES" "${{ inputs.base }}" "" "" | sed -n 's/^series=//p')
          [ -n "$ids" ] || exit 1
          git clone -q --filter=blob:none "$UBOOT_REPO" work/u-boot
          git -C work/u-boot checkout -q "${{ steps.refs.outputs.commit }}"
          $CI_RUN python3 -m ubci.stack fetch work/stack $ids
          $CI_RUN python3 -m ubci.stack apply work/u-boot work/stack
      - name: Create the run document and publish it
        env:
          KIND: ${{ inputs.kind }}
          BASE: ${{ inputs.base }}
          TARGETS: ${{ inputs.targets }}
          TITLE: ${{ inputs.title }}
        run: |
          mkdir -p work
          args=(--id "$FINGERPRINT" --kind "$KIND" --branch "$BASE" --commit "${{ steps.refs.outputs.commit }}"
                --fingerprint "$FINGERPRINT" --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          [ -n "$TARGETS" ] && args+=(--targets "$TARGETS")
          [ -n "$TITLE" ] && args+=(--title "$TITLE")
          [ -f work/stack/stack.json ] && args+=(--stack work/stack/stack.json)
          $CI_RUN python3 -m ubci.run new "work/$FINGERPRINT.json" "${args[@]}"
          $CI_RUN scripts/site-checkout.sh site
          $CI_RUN scripts/publish-site.sh site "work/$FINGERPRINT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.base }}-run
          path: |
            work/${{ env.FINGERPRINT }}.json
            work/stack/
          retention-days: 7

  ci:
    # Runs U-Boot and patch code: no environment, no secret, a read-only
    # token. The Linux payload is cached and uploaded before any patch
    # code runs, so a series cannot change what later runs or its own
    # hardware jobs boot.
    needs: prepare
    runs-on: [self-hosted, cil, 32c-32g-200g]
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      LINUX_TAG: ${{ needs.prepare.outputs.linux_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the CI container
        run: docker build --network host -q -t u-boot-ci:1 docker
      - uses: actions/cache/restore@v4
        id: linux
        with:
          path: work/out/linux
          key: linux-${{ env.LINUX_TAG }}-${{ hashFiles('scripts/build-linux.sh', 'docker/Dockerfile') }}
      - uses: actions/cache/restore@v4
        id: initramfs
        with:
          path: work/out/initramfs
          key: initramfs-${{ hashFiles('config/buildroot/*', 'scripts/build-initramfs.sh', 'docker/Dockerfile') }}
      - name: Build pristine linux-next and the initramfs (once per tag / config)
        if: steps.linux.outputs.cache-hit != 'true' || steps.initramfs.outputs.cache-hit != 'true'
        # A failed payload fails the builds in run-all.sh, not the checks.
        continue-on-error: true
        run: |
          [ -f work/out/linux/linux.json ] || $CI_RUN scripts/build-linux.sh "$LINUX_TAG" work/out/linux
          [ -f work/out/initramfs/initramfs.json ] || $CI_RUN scripts/build-initramfs.sh work/out/initramfs
          rm -rf work/linux-next-* work/buildroot-*
      - uses: actions/cache/save@v4
        if: steps.linux.outputs.cache-hit != 'true' && hashFiles('work/out/linux/linux.json') != ''
        with:
          path: work/out/linux
          key: ${{ steps.linux.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: steps.initramfs.outputs.cache-hit != 'true' && hashFiles('work/out/initramfs/initramfs.json') != ''
        with:
          path: work/out/initramfs
          key: ${{ steps.initramfs.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.base }}-linux
          path: |
            work/out/linux/Image
            work/out/linux/linux.json
            work/out/linux/modules.cpio.zst
            work/out/linux/dtbs/qcom/qcs6490-rb3gen2.dtb
            work/out/linux/dtbs/qcom/monaco-arduino-monza.dtb
            work/out/linux/dtbs/qcom/monaco-el2.dtbo
            work/out/linux/dtbs/qcom/qrb2210-arduino-imola.dtb
            work/out/linux/dtbs/qcom/qcs615-ride.dtb
            work/out/linux/dtbs/qcom/talos-el2.dtbo
            work/out/linux/dtbs/qcom/lemans-evk.dtb
            work/out/linux/dtbs/qcom/lemans-el2.dtbo
            work/out/linux/dtbs/qcom/shikra-iqs-evk.dtb
            work/out/initramfs/
          retention-days: 3
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.base }}-run
          path: work/run
      - name: Host checks, every board and stack, sizes
        env:
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BASE_COMMIT: ${{ needs.prepare.outputs.base_commit }}
        run: |
          git clone -q --filter=blob:none "$UBOOT_REPO" work/u-boot
          git -C work/u-boot checkout -q "$COMMIT"
          # An ad-hoc run checks the stack: checkpatch from the base commit.
          since=$BASE_COMMIT stack=()
          if [ -f work/run/stack/stack.json ]; then
            since=$COMMIT stack=(work/run/stack)
          fi
          $CI_RUN scripts/run-all.sh work/u-boot "work/run/$FINGERPRINT.json" "$FINGERPRINT" "$since" \
            work/out/linux work/out/initramfs work/out "${stack[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.base }}-host
          path: |
            work/out/host/*.json
            work/out/host/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.base }}-packages
          path: |
            work/out/targets/*.qcomflash.tar.gz
            work/out/targets/*.build.json
            work/out/targets/*-*/*.json
            work/out/targets/*-*/u-boot.elf
            work/out/targets/*-*/u-boot.[mb][bi][n]
            work/out/targets/*-*/boot.img
          retention-days: 3

  submit:
    # Holds LAVA_TOKEN; runs no U-Boot code.
    needs: [prepare, ci]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: [self-hosted, cil, arm64, 2c-4g-20g]
    environment: lava-hw
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      LAVA_TOKEN: ${{ secrets.LAVA_TOKEN }}
      PIN_BL2_RB3GEN2: ${{ secrets.PIN_BL2_RB3GEN2 }}
      PIN_BL2_VENTUNO_Q: ${{ secrets.PIN_BL2_VENTUNO_Q }}
      PIN_BL2_UNO_Q: ${{ secrets.PIN_BL2_UNO_Q }}
      PIN_BL2_QCS615_RIDE: ${{ secrets.PIN_BL2_QCS615_RIDE }}
      PIN_BL2_LEMANS_EVK: ${{ secrets.PIN_BL2_LEMANS_EVK }}
      BASE: ${{ inputs.base }}
      UBCI_IMAGE: u-boot-ci-control:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.base }}-*
          path: work/artifacts
      - name: Record the Linux payload and the host checks
        run: |
          docker build --network host -q --target control -t "$UBCI_IMAGE" docker
          run="work/artifacts/$BASE-run/$FINGERPRINT.json"
          [ -f work/artifacts/$BASE-linux/linux/linux.json ] && $CI_RUN python3 -m ubci.run linux "$run" work/artifacts/$BASE-linux/linux/linux.json
          # The configs each build used (a board fragment the base lacks shows).
          [ -d work/artifacts/$BASE-packages ] && $CI_RUN python3 -m ubci.run built "$run" work/artifacts/$BASE-packages
          for c in buildman fragments checkpatch docs sandbox qemu_arm64 carry size; do
            f=work/artifacts/$BASE-host/$c.json
            if [ -f "$f" ]; then
              r=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"])' "$f")
              s=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"])' "$f")
              $CI_RUN python3 -m ubci.run host "$run" "$c" "$r" --summary "$s"
            else
              $CI_RUN python3 -m ubci.run host "$run" "$c" skip --summary "did not run"
            fi
          done
          mkdir -p work/packages
          mv work/artifacts/$BASE-packages/*.qcomflash.tar.gz work/artifacts/$BASE-packages/*.build.json work/packages/ 2>/dev/null || true
      - name: Submit to LAVA and collect, publishing the dashboard as it goes
        run: |
          run="work/artifacts/$BASE-run/$FINGERPRINT.json"
          ci() { $CI_RUN "$@"; }
          ci scripts/site-checkout.sh site
          if [ -z "$LAVA_TOKEN" ]; then
            ci python3 -m ubci.run skip "$run" "hardware skipped: no LAVA_TOKEN in the lava-hw environment"
            ci scripts/publish-site.sh site "$run"
            exit 0
          fi
          baseline="site/runs/${{ needs.prepare.outputs.baseline }}.json"
          b=""
          [ -n "${{ needs.prepare.outputs.baseline }}" ] && [ -f "$baseline" ] && b="--baseline $baseline"
          # A failed pass (network, a concurrent publish) is retried on the next one.
          until ci python3 -m ubci.run finished "$run"; do
            ci python3 -m ubci.run submit "$run" work/packages || echo "submit failed, retrying"
            ci python3 -m ubci.run collect "$run" $b || echo "collect failed, retrying"
            ci scripts/publish-site.sh site "$run" || echo "publish failed, retrying"
            sleep 300
          done
          ci scripts/publish-site.sh site "$run"

  finalize:
    # The one job that starts after a cancel: when the run ended before
    # submit finished (a cancel, or a failure that kept submit from
    # running or ending), nothing else closes the published run document
    # and the dashboard would show it in progress for ever. Runs no U-Boot
    # code; writes gh-pages.
    needs: [prepare, ci, submit]
    if: ${{ cancelled() || (failure() && needs.submit.result != 'success') }}
    runs-on: [self-hosted, cil, arm64, 2c-4g-20g]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      UBCI_IMAGE: u-boot-ci-control:1
      CONCLUSION: ${{ contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - name: Close the run document
        run: |
          docker build --network host -q --target control -t "$UBCI_IMAGE" docker
          $CI_RUN scripts/site-checkout.sh site
          # prepare publishes it last: a run stopped before that has none.
          doc="site/runs/$FINGERPRINT.json"
          [ -f "$doc" ] || { echo "no run document published"; exit 0; }
          mkdir -p work && cp "$doc" "work/$FINGERPRINT.json"
          $CI_RUN python3 -m ubci.run close "work/$FINGERPRINT.json" "$CONCLUSION"
          $CI_RUN scripts/publish-site.sh site "work/$FINGERPRINT.json"
