# Arduino VENTUNO Q (QCS8275, Monaco). See docs/boards/ventuno-q.md.
name: ventuno-q
title: VENTUNO Q
soc: QCS8275 (Monaco)
lava:
  device_type: monaco-arduino-monza
  storage: emmc
  luns: [0, 1]
  firehose: prog_firehose_ddr.elf
  xbl_marker: "SBL1, End"
downstream:
  # The boot binaries and CDT meta-qcom-arduino pins for ventuno-q
  # (firmware-qcom-boot-qcs8300_00142.bb, firmware-qcom-cdt-ventuno-q.bb).
  release: QCS8300 boot binaries 00150
  bootbinaries:
    - url: https://softwarecenter.qualcomm.com/nexus/generic/product/chip/tech-package/QCS8300_bootbinaries.1.0/qcs8300_bootbinaries.1.0-test-device-public/00150/QCS8300_bootbinaries_00150.zip
      sha256: d1f71348523bdf8c8eeebfa464f39cdb3a27772d2f41f70ddfb69e4f700fb4e7
    - url: https://softwarecenter.qualcomm.com/nexus/generic/product/chip/tech-package/QCS8300_bootbinaries.1.0/qcs8300_bootbinaries.1.0-test-device-public/00150/QCS8300_bootbinaries_immutable_00150.zip
      sha256: 950978f97debf8a8d7386604235c0161ba2a80ca030095d4ef512ea165383f33
  cdt:
    url: https://artifacts.codelinaro.org/artifactory/codelinaro-le/Qualcomm_Linux/QCS8300/cdt/qcs8275-Monza_v1.zip
    sha256: 8484beb2ac1ff74a129c586f6d5331536765975dbabfb0600509f11010ec1c41
    file: cdt_qcs8275-Monza.bin
  xbl_config: xbl_config.elf
  partitions: {board: platforms/boards/qcs8275-monza.yaml, storage: emmc}
  source: {meta-qcom: f281f83673cdb5a9f85c9cf93969136c7cda86e1, meta-qcom-arduino: a451c5a29b5782d425dac69085ccd31c8b2ca3f2}
  # Where this pin comes from; the pin watcher (python3 -m ubci.stockpin)
  # opens a PR when a layer moves on.
  upstream:
    layers:
      meta-qcom: {repo: https://github.com/qualcomm-linux/meta-qcom, branch: master}
      meta-qcom-arduino: {repo: https://github.com/qualcomm-linux/meta-qcom-arduino, branch: main}
    bootbinaries:
      layer: meta-qcom
      recipe: recipes-bsp/firmware-boot/firmware-qcom-boot-qcs8300_*.bb
      release: QCS8300 boot binaries {pv}
    cdt:
      layer: meta-qcom-arduino
      recipe: recipes-bsp/firmware-boot/firmware-qcom-cdt-ventuno-q.bb
      name: cdt-qcs8275-monza
u-boot:
  # stock: U-Boot replaces UEFI in uefi_a/uefi_b, as meta-qcom-arduino
  # does; no VENTUNO Q config on main, so the QCS8300 one with the
  # board's upstream DT (mkmbn takes the qcom,qcs8300 load address). The
  # QCS8300 series renames it qcom_monaco_defconfig.
  stock:
    configs: ["qcom_monaco_defconfig|qcom_qcs8300_defconfig"]
    device_tree: qcom/monaco-arduino-monza
    image: u-boot.mbn
  # open: the board fragment comes with the VENTUNO Q series.
  open:
    configs: [qcom_defconfig, tfa-optee.config, "arduino-ventuno-q.config?"]
    device_tree: qcom/monaco-arduino-monza
    image: u-boot.bin
linux:
  dtb: qcom/monaco-arduino-monza.dtb
  overlays:
    stock: []
    open: [qcom/monaco-el2.dtbo]
  # Shown with the boot verdict, which stays a fail (docs/boards/ventuno-q.md).
  gaps:
    stock: &not-upstream
      - >-
        upstream U-Boot does not support this board yet: without the VENTUNO
        Q series (QCS8300 pinctrl, GCC SDCC clocks, board config) the eMMC
        does not probe and U-Boot finds nothing to boot
    open: *not-upstream
  cmdline: console=ttyMSM0,115200n8
boot_chain:
  stock:
    - {stage: XBL, origin: downstream}
    - {stage: TZ (QTEE), origin: downstream}
    - {stage: hypervisor (Gunyah), origin: downstream}
    - {stage: U-Boot, origin: upstream, component: u-boot, detail: in place of UEFI}
    - {stage: Linux, origin: upstream, component: linux}
  open:
    - {stage: XBL, origin: downstream}
    - {stage: TF-A BL2, origin: upstream, component: tf-a bl2}
    - {stage: TF-A BL31, origin: upstream, component: tf-a}
    - {stage: OP-TEE, origin: upstream, component: optee}
    - {stage: hypervisor, origin: none}
    - {stage: U-Boot, origin: upstream, component: u-boot, detail: BL33 in the FIP}
    - {stage: Linux, origin: upstream, component: linux, detail: EL2}
uboot_checks:
  - [bdinfo, bdinfo, "boot_params"]
  - [dm-tree, dm tree, "root_driver"]
  - [clocks, clk dump, "Usecnt"]
  - [storage, mmc info, "Capacity:"]
  - [usb, usb tree, "USB device tree"]
  - [efi-media, efidebug dh, "Block IO"]
  - [bootflow, bootflow scan -l, "efi"]
smoke:
  cpus: 8
  storage: "ls /sys/class/block | grep -q '^mmcblk0$' && dd if=/dev/mmcblk0 of=/dev/null bs=1M count=16"
  usb: "ls /sys/bus/usb/devices | grep -q '^usb[0-9]'"
  network: "ls /sys/class/net | grep -qv '^lo$'"
