      commit: c6dedc7baa16400fc084dc9ff5e6533fd796bcce
      soc_branch: {name: qcom/agatti, commit: 7f4a15b09c264fce5b9aeb67c08ae1b9d0c9e94e}
      flags: PLAT=uno_q SPD=opteed
      fip_load_addr: "0x5f800000"
      upstream: *tfa-upstream
    bl2:
      # TF-A BL2 with a QTI signature (this XBL accepts no test signature
