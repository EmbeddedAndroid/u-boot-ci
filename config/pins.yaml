      sha256: 5e2d730bcbd319c4e9ba9de6ba598bf55d32f9c419bb0403507c14a8b469c05a
      fingerprint: QCDFP-261101-472
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: b5e5f7a0f85aff4d1da7077370b74f2c63b89394
      soc_branch: {name: qcom/talos, commit: 7f1c6f5bf0aa052f0123771b4dab23196d5a9076}
      platform: qcom-talos
      make_args: *optee-pas-args
      upstream: *optee-upstream
  lemans-evk:
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: qcom/integration
      commit: c6dedc7baa16400fc084dc9ff5e6533fd796bcce
      soc_branch: {name: qcom/lemans, commit: 657d882414160b1693dd7cb5dae36a21567cb5c4}
      flags: PLAT=lemans_evk SPD=opteed
      fip_load_addr: "0xaf000000"
      # The FIT the SPL stack's U-Boot SPL loads: BL31, OP-TEE, U-Boot.
      fit: {atf: "0x1c200000", optee: "0x1c300000", uboot: "0xaf000000"}
      upstream: *tfa-upstream
    bl2:
      # TF-A BL2, SWIV-annotated for lemans and test-signed as TZ with
      # the pinned swiv and qtestsign (XBL loads it from tz_a/tz_b).
      file: tz-lemans-evk.mbn
      secret: PIN_BL2_LEMANS_EVK
      sha256: f93439ce34169eb61515e65a3c9a7ae506690851301affbe249654ce4ba2a5e3
      fingerprint: QCDFP-261101-473
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: b5e5f7a0f85aff4d1da7077370b74f2c63b89394
