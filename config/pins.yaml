# Open firmware stack per board: the pinned components around the U-Boot
# under test. Bumping a pin is a PR reviewed by Tyler; `python3 -m ubci
# carry` refreshes the carried lists (distance to upstream) and CI checks
# they match the pinned commits.
boards:
  rb3gen2:
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: kodiak-native-v4
      commit: 23b6bf615281242ddf71c5e652aca534dff123d9
      flags: PLAT=rb3gen2 SPD=opteed
      fip_load_addr: "0x9fc00000"
      upstream:
        repo: https://review.trustedfirmware.org/TF-A/trusted-firmware-a
        branch: master
        gerrit: https://review.trustedfirmware.org
        project: TF-A/trusted-firmware-a
    bl2:
      # TF-A BL2 of the tf-a pin, signed with the OEM TEST key of
      # Qualcomm's public sectools (scripts/sign-bl2-oem.sh); XBL loads it
      # from tz_a/tz_b.
      file: tz-rb3gen2.mbn
      # Not public: CI reads it (gzip + base64) from this secret of the
      # LAVA environments; locally it is staged in $UBCI_WORK/pins.
      secret: PIN_BL2_RB3GEN2
      profile:
        url: https://raw.githubusercontent.com/EmbeddedAndroid/qcom-buildroot/301396cb55898bbadf885717d59cdd4aa18844cb/kodiak/security/kodiak_tzt_security_profile.xml
        sha256: 1ace4f443fab34b9b19a4d3a104983089a6d2b0d46765b200c9f7ef5f052c37f
      sha256: b46c27937615bfa1ca3c3963b1cf866ac8c2c6a4e099bd5daecc983ca2a544d4
      fingerprint: ubci-pin-bl2-rb3gen2-261024-0109
    optee:
      repo: https://github.com/OP-TEE/optee_os
      branch: master
      commit: 2cabb6d063513e1718f7627e16b0a5ce1bfd5516
      platform: qcom-kodiak
      upstream:
        repo: https://github.com/OP-TEE/optee_os
        branch: master
  ventuno-q:
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: ventuno-q-v3
      commit: 4930db330cb03cfe2124f41bf1852cff9e7abd22
      flags: PLAT=monza SPD=opteed
      fip_load_addr: "0xaf000000"
      upstream:
        repo: https://review.trustedfirmware.org/TF-A/trusted-firmware-a
        branch: master
        gerrit: https://review.trustedfirmware.org
        project: TF-A/trusted-firmware-a
    bl2:
      # TF-A BL2 of the tf-a pin with a QTI signature (this XBL accepts no
      # test signature on tz); pre-signed, so it keeps its own fingerprint.
      file: tz-ventuno-q.mbn
      secret: PIN_BL2_VENTUNO_Q
      sha256: 91f4618318d49d15440ac31101cdf4ab2e4c8693c95f4867ebf2e65ed30e100f
      fingerprint: MONZAFP-261008-154802-pr2-fs
    optee:
      repo: https://github.com/OP-TEE/optee_os
      branch: master
      commit: 2cabb6d063513e1718f7627e16b0a5ce1bfd5516
      platform: qcom-monaco
      upstream:
        repo: https://github.com/OP-TEE/optee_os
        branch: master
  # UNO Q and QCS615 Ride pin the hardware-gated qcom/integration
  # snapshot of 2026-10-24/25. Those commits are not on the public forks
  # ("pending"): the open stack of these boards is skipped with that
  # reason until their pins move to the pushed qcom/integration head, as
  # Lemans EVK's has. soc_branch records the per-platform branch head the
  # pinned integration commit carries.
  uno-q:
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: qcom/integration
      commit: f2b3d43e002c0866ec3cbea21285f790603a4865
      soc_branch: {name: qcom/agatti, commit: 7f4a15b09c264fce5b9aeb67c08ae1b9d0c9e94e}
      pending: gated qcom/integration snapshot, not pushed yet
      flags: PLAT=uno_q SPD=opteed
      fip_load_addr: "0x5f800000"
      upstream: &tfa-upstream
        repo: https://review.trustedfirmware.org/TF-A/trusted-firmware-a
        branch: master
        gerrit: https://review.trustedfirmware.org
        project: TF-A/trusted-firmware-a
    bl2:
      # TF-A BL2 of the tf-a pin with a QTI signature (this XBL accepts no
      # test signature on tz); pre-signed, so it keeps its own fingerprint.
      file: tz-uno-q.mbn
      secret: PIN_BL2_UNO_Q
      sha256: 09d1770fcdbd12fd18fd1cca84cfeaf3f1a915a851cff673ab24d4e48b10ecff
      fingerprint: QCDFP-261024-68
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: bd6f523e58b41486ebb280de43898b3bff92f0c2
      soc_branch: {name: qcom/agatti, commit: 2518bc06b2f0a658e9f3d2752d692881869eae50}
      pending: gated qcom/integration snapshot, not pushed yet
      platform: qcom-agatti
      upstream: &optee-upstream
        repo: https://github.com/OP-TEE/optee_os
        branch: master
  qcs615-ride:
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: qcom/integration
      commit: f2b3d43e002c0866ec3cbea21285f790603a4865
      soc_branch: {name: qcom/talos, commit: b3fbecd10dddb51ff7b5a9cdceb37a6e43a50ac9}
      pending: gated qcom/integration snapshot, not pushed yet
      flags: PLAT=qcs615_ride SPD=opteed
      fip_load_addr: "0x9fc00000"
      upstream: *tfa-upstream
    bl2:
      file: tz-qcs615-ride.mbn
      secret: PIN_BL2_QCS615_RIDE
      sha256: 4616ba74a1285ab764399f7c6d29fccc4267702bce6d0b22cb0f24f9b566332a
      fingerprint: QCDFP-261024-62
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: bd6f523e58b41486ebb280de43898b3bff92f0c2
      soc_branch: {name: qcom/talos, commit: 120a891f1f421c916fc9141a6bf380770ab8ba9c}
      pending: gated qcom/integration snapshot, not pushed yet
      platform: qcom-talos
      # The early TAs the board's remoteprocs need (qcom_pas) and
      # trusted keys, as the gated build; one make argument per item.
      make_args:
        - CFG_USER_TA_TARGETS=ta_arm64
        - DEBUG=0
        - CFG_IN_TREE_EARLY_TAS=trusted_keys/f04a0fe7-1f5d-4b9b-abf7-619b85b4ce8c qcom_pas/cff7d191-7ca0-4784-af13-48223b9a4fbe
      upstream: *optee-upstream
  lemans-evk:
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: qcom/integration
      commit: 17d3a8df67ac9a5670d8a8627e24d6c158ef5fe3
      soc_branch: {name: qcom/lemans, commit: 657d882414160b1693dd7cb5dae36a21567cb5c4}
      flags: PLAT=lemans_evk SPD=opteed
      # U-Boot SPL loads a FIT, not a FIP: BL31, OP-TEE, U-Boot.
      image: uefi.itb
      fit: {atf: "0x1c200000", optee: "0x1c300000", uboot: "0xaf000000"}
      upstream: *tfa-upstream
    bl2:
      # What XBL loads from tz on this boot chain: U-Boot SPL, pre-built
      # and test-signed, from a tree that is not public (no Lemans SPL
      # on U-Boot main yet). Downstream until it is.
      name: u-boot spl
      banner: U-Boot SPL
      origin: downstream
      file: tz-lemans-evk.mbn
      secret: PIN_BL2_LEMANS_EVK
      sha256: c6cb506e3e51172446b8ec456dd647d9556ad55d5c6b94bc5ca3e39edc9a3893
      fingerprint: LEMANSFP-261009-030954-lpb4
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: 48e45590f07fa19f3f8be80f9d8b2d03858f130a
      soc_branch: {name: qcom/lemans, commit: 67b4531d230bf10a9bbeed925a554ed90eda3de7}
      platform: qcom-lemans
      make_args:
        - CFG_USER_TA_TARGETS=ta_arm64
        - DEBUG=0
        - CFG_IN_TREE_EARLY_TAS=trusted_keys/f04a0fe7-1f5d-4b9b-abf7-619b85b4ce8c qcom_pas/cff7d191-7ca0-4784-af13-48223b9a4fbe
      upstream: *optee-upstream
  shikra-iqs-evk:
    # For the U-Boot SPL stack once a Shikra SPL config is posted; the
    # board has no FIP open stack (no bl2).
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: qcom/integration
      commit: 17d3a8df67ac9a5670d8a8627e24d6c158ef5fe3
      soc_branch: {name: qcom/shikra, commit: dc6def90397f3d165359fdd751560c648be8d2e5}
      flags: PLAT=shikra_evk SPD=opteed
      image: uefi.itb
      fit: {atf: "0xA1300000", optee: "0xA1400000", uboot: "0x87980000"}
      upstream: *tfa-upstream
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: 48e45590f07fa19f3f8be80f9d8b2d03858f130a
      soc_branch: {name: qcom/shikra, commit: 62a6594de998900064a19d724c1dd9fc32cd6f9e}
      platform: qcom-shikra
      upstream: *optee-upstream
qtestsign:
  repo: https://github.com/msm8916-mainline/qtestsign
  commit: 0eef3b552b1ada848f22bad38ab2e40407307c5b
# The SWIV annotation an SPL needs before XBL takes it as the TZ image
# (meta-qcom swiv-build-utility_git.bb pins the same commit).
swiv:
  repo: https://github.com/qualcomm-linux/boot-firmware-ci
  commit: a0f007327c1ffc0b568def06c4b035b8d3fb05ac
