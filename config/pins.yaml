      platform: qcom-lemans
      make_args: *optee-pas-args
      upstream: *optee-upstream
  shikra-iqs-evk:
    # For the U-Boot SPL stack once a Shikra SPL config is posted; the
    # board has no FIP open stack (no bl2).
    tf-a:
      repo: https://github.com/EmbeddedAndroid/arm-trusted-firmware
      branch: qcom/integration
      commit: c6dedc7baa16400fc084dc9ff5e6533fd796bcce
      soc_branch: {name: qcom/shikra, commit: dc6def90397f3d165359fdd751560c648be8d2e5}
      flags: PLAT=shikra_evk SPD=opteed
      image: uefi.itb
      fit: {atf: "0xA1300000", optee: "0xA1400000", uboot: "0x87980000"}
      upstream: *tfa-upstream
    optee:
      repo: https://github.com/EmbeddedAndroid/optee_os
      branch: qcom/integration
      commit: b5e5f7a0f85aff4d1da7077370b74f2c63b89394
      soc_branch: {name: qcom/shikra, commit: 4c3630d5b2e3929765b92ee9d27169a9fb446bee}
      platform: qcom-shikra
      upstream: *optee-upstream
  sm8750-mtp:
    # Wildcat: TF-A and OP-TEE are built from the internal qcom/integration
    # (tag qcom/integration-20261101), which this repository may not see.
    # The CI holds their images only, pinned by sha256 and fingerprint; the
    # submit job fetches them from the private store and builds the FIP
    # around the U-Boot under test (docs/private-firmware.md).
    tf-a:
      private: internal qcom/integration-20261101 (PLAT=sm8750_mtp)
      release: qcom-integration-20261101
      file: bl31-sm8750-mtp.bin
      sha256: 312fd1aa486e3b652292eca45d2393e60d6670cb3c1769227512be4ca1455000
      fingerprint: QCDFP-261101-475
      fip_load_addr: "0xa7000000"
      # qtestsign arguments for the fip.elf XBL loads from uefi_a/uefi_b.
      sign: [-v7, uefi]
    bl2:
